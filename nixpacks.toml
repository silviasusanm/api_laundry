[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "composer"]

[phases.install]
cmds = ["composer install --ignore-platform-reqs --no-dev --optimize-autoloader"]

[phases.build]
cmds = []

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT"